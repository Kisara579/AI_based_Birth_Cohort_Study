name: Deploy Backend to Hugging Face Space

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HF_SSH_KEY }}

      - name: Debug SSH
        run: |
          which ssh
          ssh -V
          nslookup huggingface.co || true
          ping -c 2 huggingface.co || true

      - name: Test SSH authentication
        run: |
          ssh -o StrictHostKeyChecking=no -T git@huggingface.co || true

      - name: Test clone of Space
        run: |
          git clone git@huggingface.co:spaces/kisarab/birth-cohort-api.git hf-space
          ls -la hf-space
