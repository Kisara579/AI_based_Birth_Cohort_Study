name: Deploy Backend to Hugging Face Space

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HF_SSH_KEY }}

      - name: Add Hugging Face to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan huggingface.co >> ~/.ssh/known_hosts

      - name: Test SSH authentication
        run: |
          ssh -T git@huggingface.co

      - name: Test clone of Space
        run: |
          git clone git@huggingface.co:spaces/kisarab/birth-cohort-api.git hf-space
          ls -la hf-space
