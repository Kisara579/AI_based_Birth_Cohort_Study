name: Deploy Backend to Hugging Face Space

on:
  push:
    branches:
      - "main"
    paths:
      - "backend/**"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HF_TOKEN }}

      - name: Disable strict host checking
        run: |
          mkdir -p ~/.ssh
          echo -e "Host huggingface.co\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh -T -o StrictHostKeyChecking=no git@huggingface.co || true
      
      - name: Push backend to Hugging Face Space
        run: |
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"

          
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          git clone git@huggingface.co:spaces/kisarab/birth-cohort-api.git hf-space

          rsync -av --delete backend/ hf-space/

          cd hf-space

          git add .

          git diff --cached --quiet || git commit -m "Auto deploy backend from GitHub"

          git push origin main
